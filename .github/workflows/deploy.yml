# Veröffentlicht die Website per SFTP auf dem Hetzner-Webhosting.
#
# Auslöser: Push auf den Branch „main“ oder manuell (Actions → Veröffentlichen → Run workflow).
# Sicherheitsnetz: Solange offene Markierungen ([[PLATZHALTER]], [[PRÜFEN]], [[PREIS]] …)
# im Inhalt stehen, bricht die Veröffentlichung ab. Für eine Vorschau kann man das beim
# manuellen Start ausdrücklich übergehen – dann NICHT auf die Live-Domain veröffentlichen.
#
# Benötigte Secrets (GitHub → Settings → Secrets and variables → Actions):
#   SFTP_HOST       z. B. www123.your-server.de (konsoleH → Zugangsdaten)
#   SFTP_PORT       SSH/SFTP-Port (Hetzner Webhosting: siehe README)
#   SFTP_BENUTZER   FTP/SSH-Benutzer
#   SFTP_PASSWORT   Passwort
#   SFTP_ZIEL       Zielordner, z. B. /public_html  (Vorschau: /vorschau)
name: Veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      trotz_offener_punkte:
        description: "Trotz offener Markierungen veröffentlichen (nur für eine Vorschau!)"
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: produktion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Offene Punkte prüfen (bricht bei Markierungen ab)
        if: ${{ !inputs.trotz_offener_punkte }}
        run: npm run pruefen -- --streng
      - name: Build
        run: npm run build
      - name: Technische Tests
        run: npm run test:dist
      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Per SFTP hochladen
        env:
          HOST: ${{ secrets.SFTP_HOST }}
          PORT: ${{ secrets.SFTP_PORT }}
          BENUTZER: ${{ secrets.SFTP_BENUTZER }}
          PASSWORT: ${{ secrets.SFTP_PASSWORT }}
          ZIEL: ${{ secrets.SFTP_ZIEL }}
        run: |
          # --delete entfernt alte Dateien auf dem Server; Let's-Encrypt-Ordner und
          # Formular-Zugangsdaten bleiben unangetastet.
          lftp -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:timeout 30;
            open -u \"$BENUTZER\",\"$PASSWORT\" -p ${PORT:-22} sftp://$HOST;
            mirror --reverse --delete --parallel=4 --verbose=1 \
              --exclude-glob .well-known/ \
              --exclude-glob anfrage-konfiguration.php \
              dist/ \"$ZIEL\";
            bye"
